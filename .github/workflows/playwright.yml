name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tests repository
        uses: actions/checkout@v4

      # 1. Clone the target application (SUT)
      - name: Clone SUT (Practice Software Testing)
        run: git clone https://github.com/testsmith-io/practice-software-testing.git sut

      # 2. Configure the environment variables for the SUT
      - name: Configure Sprint 5 in SUT
        working-directory: sut
        run: |
          echo "SPRINT=sprint5" > .env
          echo "DISABLE_LOGGING=true" >> .env

      # 3. Start the stack using prebuilt production images (Fast boot)
      - name: Start SUT via Docker Compose (build-from-source)
        working-directory: sut
        run: docker compose up -d --build --force-recreate

      - name: Fix bootstrap/cache permissions
        working-directory: sut
        run: docker compose exec -T -u root laravel-api sh -c "mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} && chmod -R 777 bootstrap/cache storage"

      - name: Install Composer dependencies
        working-directory: sut
        run: docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi

      # 4. Wait for MariaDB to be fully ready to accept connections
      - name: Wait for database to be ready
        working-directory: sut
        run: |
          echo "Waiting for MariaDB..."
          for i in $(seq 1 30); do
            if docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
              echo "MariaDB is ready!"
              break
            fi
            echo "Attempt $i/30 - not ready yet, waiting 2s..."
            sleep 2
          done

      # 5. Run migrations and seed the database with default data
      - name: Migrate and seed database
        working-directory: sut
        run: docker compose exec -T laravel-api php artisan migrate:fresh --seed

      # 6. Wait for the API to be healthy
      - name: Wait for API to be healthy
        run: |
          echo "Waiting for API on port 8091..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8091/status | grep -q "200"; then
              echo "API is ready!"
              break
            fi
            sleep 2
          done

      # 7. Wait for the Angular UI to be healthy
      - name: Wait for Angular UI to be ready
        run: |
          echo "Waiting for Angular UI on port 4200..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 | grep -q "200"; then
              echo "Angular UI is ready!"
              break
            fi
            sleep 2
          done

      - name: Build Angular for production and serve statically
        working-directory: sut
        run: |
          docker compose exec -T angular-ui sh -c "npm install --force && npx ng build --configuration production"
          docker compose exec -T -d angular-ui sh -c "npx http-server dist/*/browser -p 4200"

      # 8. Setup Node and install your test dependencies
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm ci

      # 9. Install Playwright (only Chromium to save time)
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        

      # 10. Run the tests against the local deployment
      - name: Run Playwright tests
        run: npx playwright test --project=chromium --workers=1 --reporter=list,html
        env:
          URL: http://localhost:4200
          API_URL: http://localhost:8091

      # 11. Upload the report if tests fail
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30