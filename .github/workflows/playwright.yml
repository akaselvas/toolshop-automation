name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone SUT
        run: git clone https://github.com/testsmith-io/practice-software-testing.git sut

      - name: Configure Sprint 5
        working-directory: sut
        run: |
          echo "SPRINT=sprint5" > .env
          echo "DISABLE_LOGGING=true" >> .env

      # SOLUÇÃO DO PONTO 1 E 2: Usa a versão PROD (Nginx + PHP-FPM). Rápido e sem compilação falsa!
      - name: Start SUT via Docker Compose
        working-directory: sut
        run: docker compose -p pst -f docker-compose.prod.yml up --pull missing -d

      - name: Wait for database to be ready
        working-directory: sut
        run: |
          for i in $(seq 1 30); do
            if docker compose -p pst exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
              break
            fi
            sleep 2
          done

      # SOLUÇÃO DO BANCO VAZIO: Semeia os dados padrão (admin, customer, produtos)
      - name: Migrate and seed database
        working-directory: sut
        run: docker compose -p pst exec -T laravel-api php artisan migrate:fresh --seed

      # SOLUÇÃO DO PONTO 1: Espera o Nginx de produção responder
      - name: Wait for Angular UI to be ready
        run: npx wait-on http://localhost:4200 --timeout 60000

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # SOLUÇÃO DO PONTO 3: Roda com 1 worker para evitar colisão nas contas estáticas
      - name: Run Playwright tests
        run: npx playwright test --project=chromium --workers=1 --reporter=list,html
        env:
          URL: http://localhost:4200
          API_URL: http://localhost:8091

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

        # 6.1. SALVA-VIDAS: Se o teste falhar ou travar, imprime os logs do servidor (Laravel/Nginx)
      - name: Dump Docker logs on failure
        if: failure()
        working-directory: sut
        run: docker compose -p pst logs --tail=200