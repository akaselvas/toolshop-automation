name: Playwright Tests
on:
  push: { branches: [main, master] }
  pull_request: { branches: [main, master] }
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone SUT
        run: git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git sut

      - name: Configure Sprint 5
        working-directory: sut
        run: |
          echo "SPRINT=sprint5" > .env
          echo "DISABLE_LOGGING=true" >> .env

      # NOTE: no "-f docker-compose.yml" here — let compose auto-merge
      # docker-compose.override.yml too (mailcatcher + cron/queue worker)
      - name: Start SUT via Docker Compose
        working-directory: sut
        run: docker compose up -d --build --force-recreate

      - name: Wait for database
        working-directory: sut
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null && break
            sleep 2
          done

      - name: Install Composer dependencies (safety net)
        working-directory: sut
        run: docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi

      - name: Migrate and seed database
        working-directory: sut
        run: docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Sanity-check API
        run: |
          curl -v http://localhost:8091/status
          curl -v -X POST 'http://localhost:8091/users/login' -H 'Content-Type: application/json' \
            --data-raw '{"email":"customer@practicesoftwaretesting.com","password":"welcome01"}'

      - name: Wait for Angular UI (first ng serve compile can take minutes)
        working-directory: sut
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4200)
            [ "$code" = "200" ] && exit 0
            echo "Attempt $i/60 - got $code, waiting 5s..."
            sleep 5
          done
          docker compose logs angular-ui
          exit 1

      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium --workers=1 --reporter=list,html
        env:
          URL: http://localhost:4200
          API_URL: http://localhost:8091

      - name: Dump docker logs on failure
        if: failure()
        working-directory: sut
        run: docker compose logs --tail=300

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30