name: Playwright Tests (Live Site)
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Instala apenas o Chromium para economizar tempo
      - name: Install Playwright Chromium & OS dependencies
        run: npx playwright install --with-deps chromium

      # Roda os testes apontando para o site online, com 1 worker e no Chromium
      - name: Run Playwright tests
        run: npx playwright test --project=chromium --workers=1 --reporter=list,html
        env:
          URL: https://practicesoftwaretesting.com
          API_URL: https://api.practicesoftwaretesting.com

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30